[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lastfrontier"
version = "0.1.0"
description = "Last Frontier CLI tool"
authors = [{ name = "Karina" }]
dependencies = []

[project.scripts]
lastfrontier = "lastfrontier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lastfrontier = ["data/*.txt"]